<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDSL Viewer / Editor</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: sans-serif;
      background: #1e1e2e;
      color: #cdd6f4;
      height: 100vh;
      overflow: hidden;
    }

    #app {
      display: flex;
      height: 100vh;
    }

    #left-pane {
      width: 40%;
      display: flex;
      flex-direction: column;
      background: #181825;
      border-right: 1px solid #313244;
    }

    #pane-header {
      background: #313244;
      padding: 6px 12px;
      font-size: 11px;
      color: #89b4fa;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    #pane-header span { color: #a6e3a1; }

    #error-panel {
      color: #f38ba8;
      font-size: 11px;
      font-family: monospace;
      padding: 4px 8px;
      background: #2a1520;
      min-height: 0;
      white-space: pre-wrap;
      border-bottom: 1px solid #313244;
      flex-shrink: 0;
    }

    #error-panel:empty {
      display: none;
    }

    #source {
      flex: 1;
      resize: none;
      font-family: 'Courier New', Courier, monospace;
      font-size: 13px;
      padding: 12px;
      background: #181825;
      color: #cdd6f4;
      border: none;
      outline: none;
      line-height: 1.5;
    }

    #divider {
      width: 5px;
      background: #313244;
      cursor: col-resize;
      flex-shrink: 0;
      transition: background 0.1s;
    }

    #divider:hover, #divider.dragging {
      background: #89b4fa;
    }

    #right-pane {
      flex: 1;
      overflow: auto;
      background: #1e1e2e;
      display: flex;
      flex-direction: column;
    }

    #right-header {
      background: #313244;
      padding: 6px 12px;
      font-size: 11px;
      color: #89b4fa;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    #svg-container {
      flex: 1;
      padding: 20px;
      overflow: auto;
    }

    #svg-container svg {
      display: block;
    }

    #context-menu {
      display: none;
      position: fixed;
      background: #313244;
      border: 1px solid #45475a;
      border-radius: 6px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      z-index: 1000;
      min-width: 140px;
      overflow: hidden;
    }

    .context-menu-item {
      padding: 8px 14px;
      cursor: pointer;
      font-size: 12px;
      color: #cdd6f4;
    }

    .context-menu-item:hover {
      background: #45475a;
      color: #89b4fa;
    }

    /* SVG entity interaction cursors (applied via JS) */
    [data-entity] { cursor: default; }
    [data-entity-header] { cursor: pointer; }
  </style>
</head>
<body>

<div id="app">
  <div id="left-pane">
    <div id="pane-header">PDSL Source <span>&#x270E; editable</span></div>
    <div id="error-panel"></div>
    <textarea id="source" spellcheck="false" autocomplete="off"></textarea>
  </div>
  <div id="divider"></div>
  <div id="right-pane">
    <div id="right-header">Diagram &mdash; double-click entity to rename &bull; right-click to add field</div>
    <div id="svg-container"></div>
  </div>
</div>

<div id="context-menu"></div>

     MODULE 1: window.PDSL namespace + ast.js
     ============================================================ -->
<script>
(function() {
  'use strict';
  window.PDSL = {};

  // ---- TokenType enum ----
  var TokenType = Object.freeze({
    LIFECYCLE: 'lifecycle', STRUCTURE: 'structure', ENTITY: 'entity',
    RELATION: 'relation', INPUT: 'input', EXECUTE: 'execute',
    TRANSITIONS: 'transitions', COMPLETION: 'completion', CONTAINS: 'contains',
    SPAWNS: 'spawns', DELEGATES: 'delegates', CHECKPOINTS: 'checkpoints',
    ON: 'on', FROM: 'from', TYPE: 'type', VIA: 'via', CARDINALITY: 'cardinality',
    CONSTRAINT: 'constraint', VALUES: 'values', ROLE: 'role', MODEL: 'model',
    TRIGGER: 'trigger', STATE: 'state', ID: 'id',
    IDENTIFIER: 'IDENTIFIER', STRING: 'STRING', NUMBER: 'NUMBER', PATTERN: 'PATTERN',
    ARROW: 'ARROW', DOT_DOT: 'DOT_DOT', COMP_EQ: 'COMP_EQ', COMP_NE: 'COMP_NE',
    COMP_LE: 'COMP_LE', COMP_GE: 'COMP_GE', COMP_LT: 'COMP_LT', COMP_GT: 'COMP_GT',
    LOGIC_AND: 'LOGIC_AND', LOGIC_OR: 'LOGIC_OR', EQUALS: 'EQUALS', COLON: 'COLON',
    PIPE: 'PIPE', QUESTION: 'QUESTION', DOT: 'DOT', STAR: 'STAR',
    LBRACE: 'LBRACE', RBRACE: 'RBRACE', LBRACKET: 'LBRACKET', RBRACKET: 'RBRACKET',
    LPAREN: 'LPAREN', RPAREN: 'RPAREN', COMMA: 'COMMA', SLASH: 'SLASH',
    EOF: 'EOF', ERROR: 'ERROR',
  });

  var KEYWORDS = new Set([
    'lifecycle','structure','entity','relation','input','execute','transitions',
    'completion','contains','spawns','delegates','checkpoints','on','from','type',
    'via','cardinality','constraint','values','role','model','trigger','state','id',
  ]);

  function createToken(type, value, line, column) { return { type, value, line, column }; }

  function loc(startToken, endToken) {
    var endValue = endToken.value != null ? String(endToken.value) : '';
    return { line: startToken.line, column: startToken.column,
             endLine: endToken.line, endColumn: endToken.column + endValue.length };
  }

  function Program(body, comments, srcLoc) { return { type: 'Program', body, comments, loc: srcLoc }; }
  function LifecycleDecl(name, props, srcLoc) { return Object.assign({ type: 'Lifecycle', name, loc: srcLoc }, props); }
  function StructureDecl(name, props, srcLoc) { return Object.assign({ type: 'Structure', name, loc: srcLoc }, props); }
  function EntityDecl(name, fields, srcLoc) { return { type: 'Entity', name, fields, loc: srcLoc }; }
  function RelationDecl(source, target, props, srcLoc) { return Object.assign({ type: 'Relation', source, target, loc: srcLoc }, props); }
  function FieldDecl(name, props, srcLoc) {
    return { type: 'Field', name,
      fieldType: props.fieldType, optional: props.optional || false,
      default: props.defaultValue, pattern: props.pattern,
      cardinality: props.cardinality, loc: srcLoc };
  }
  function TransitionRule(on, target, srcLoc) { return { type: 'Transition', on, target, loc: srcLoc }; }
  function ActionStep(verb, operands, srcLoc) { return { type: 'Action', verb, operands, loc: srcLoc }; }
  function ContainmentEntry(path, targetType, cardinality, srcLoc) { return { type: 'Containment', path, targetType, cardinality, loc: srcLoc }; }
  function SpawnEntry(targetType, cardinality, source, srcLoc) { return { type: 'Spawn', targetType, cardinality, source, loc: srcLoc }; }
  function DelegationEntry(stage, role, srcLoc) { return { type: 'Delegation', stage, role, loc: srcLoc }; }
  function CheckpointEntry(fromState, toState, condition, srcLoc) { return { type: 'Checkpoint', fromState, toState, condition, loc: srcLoc }; }
  function PatternLiteral(regex, srcLoc) { return { type: 'Pattern', regex, loc: srcLoc }; }
  function EnumType(values, srcLoc) { return { type: 'Enum', values, loc: srcLoc }; }
  function TypeExpression(kind, name, enumValues, srcLoc) { return { type: 'TypeExpression', kind, name, enumValues, loc: srcLoc }; }
  function Cardinality(min, max, notation, srcLoc) { return { type: 'Cardinality', min, max, notation, loc: srcLoc }; }
  function BinaryExpression(operator, left, right, srcLoc) { return { type: 'BinaryExpression', operator, left, right, loc: srcLoc }; }
  function LogicalExpression(operator, left, right, srcLoc) { return { type: 'LogicalExpression', operator, left, right, loc: srcLoc }; }
  function FieldRef(segments, srcLoc) { return { type: 'FieldRef', segments, loc: srcLoc }; }
  function Literal(kind, value, srcLoc) { return { type: 'Literal', kind, value, loc: srcLoc }; }

  window.PDSL.ast = {
    TokenType, KEYWORDS, createToken, loc,
    Program, LifecycleDecl, StructureDecl, EntityDecl, RelationDecl, FieldDecl,
    TransitionRule, ActionStep, ContainmentEntry, SpawnEntry, DelegationEntry,
    CheckpointEntry, PatternLiteral, EnumType, TypeExpression, Cardinality,
    BinaryExpression, LogicalExpression, FieldRef, Literal,
  };
})();
</script>

<script>
(function() {
  'use strict';
  var _ast = window.PDSL.ast;
  var TokenType = _ast.TokenType;
  var KEYWORDS = _ast.KEYWORDS;
  var createToken = _ast.createToken;
  var Program = _ast.Program;
  var LifecycleDecl = _ast.LifecycleDecl;
  var StructureDecl = _ast.StructureDecl;
  var EntityDecl = _ast.EntityDecl;
  var RelationDecl = _ast.RelationDecl;
  var FieldDecl = _ast.FieldDecl;
  var PatternLiteral = _ast.PatternLiteral;
  var EnumType = _ast.EnumType;
  var TypeExpression = _ast.TypeExpression;
  var Cardinality = _ast.Cardinality;
  var Literal = _ast.Literal;
  var TransitionRule = _ast.TransitionRule;
  var ActionStep = _ast.ActionStep;
  var ContainmentEntry = _ast.ContainmentEntry;
  var SpawnEntry = _ast.SpawnEntry;
  var DelegationEntry = _ast.DelegationEntry;
  var CheckpointEntry = _ast.CheckpointEntry;
  var BinaryExpression = _ast.BinaryExpression;
  var LogicalExpression = _ast.LogicalExpression;
  var FieldRef = _ast.FieldRef;
  var loc = _ast.loc;

  function isIdentStart(ch) { return (ch>='a'&&ch<='z')||(ch>='A'&&ch<='Z')||ch==='_'; }
  function isIdentContinue(ch) { return isIdentStart(ch)||(ch>='0'&&ch<='9')||ch==='-'; }
  function isDigit(ch) { return ch>='0'&&ch<='9'; }

  function tokenize(source) {
    var tokens = [], pos = 0, line = 1, column = 1, len = source.length;
    function peek(offset) { return source[pos + (offset||0)]; }
    function advance() {
      var ch = source[pos]; pos++;
      if (ch==='\n') { line++; column=1; } else { column++; }
      return ch;
    }
    function advanceBy(n) { for(var i=0;i<n;i++) advance(); }
    function emit(type, value, sl, sc) { tokens.push(createToken(type,value,sl,sc)); }
    var prevWasSpace = true;
    while (pos < len) {
      var startLine=line, startCol=column, ch=source[pos];
      if (ch===' '||ch==='\t'||ch==='\r'||ch==='\n') {
        prevWasSpace=true;
        if(ch==='\r'&&peek(1)==='\n'){pos++;column++;}
        advance(); continue;
      }
      var wasPrecededBySpace=prevWasSpace;
      prevWasSpace=false;
      if(ch==='/'&&peek(1)==='/'){while(pos<len&&source[pos]!=='\n'){pos++;column++;}continue;}
      if(ch==='/'&&peek(1)==='*'){
        var errLine=startLine,errCol=startCol;
        pos+=2;column+=2;var closed=false;
        while(pos<len){if(source[pos]==='*'&&source[pos+1]==='/'){pos+=2;column+=2;closed=true;break;}advance();}
        if(!closed)emit(TokenType.ERROR,'/* (unterminated)',errLine,errCol);
        continue;
      }
      if(ch==='"'){
        pos++;column++;var str='',terminated=false;
        while(pos<len){var c=source[pos];if(c==='"'){pos++;column++;terminated=true;break;}str+=c;advance();}
        emit(terminated?TokenType.STRING:TokenType.ERROR, terminated?str:'"'+str+' (unterminated)',startLine,startCol);
        continue;
      }
      if(ch==='/'){
        var nextCh=peek(1);
        var isPatternStart=wasPrecededBySpace&&nextCh!==undefined&&nextCh!==' '&&nextCh!=='\t'&&nextCh!=='\r'&&nextCh!=='\n'&&nextCh!=='/';
        if(isPatternStart){
          var scanPos=pos+1,found=false;
          while(scanPos<len&&source[scanPos]!=='\n'){if(source[scanPos]==='/'){found=true;break;}scanPos++;}
          if(found){
            pos++;column++;var body='';
            while(pos<len&&source[pos]!=='/'&&source[pos]!=='\n'){body+=source[pos];advance();}
            if(pos<len&&source[pos]==='/'){pos++;column++;emit(TokenType.PATTERN,body,startLine,startCol);}
            else{emit(TokenType.ERROR,'/'+body+' (unterminated)',startLine,startCol);}
            continue;
          }
          pos++;column++;var errBody='';
          while(pos<len&&source[pos]!=='\n'){errBody+=source[pos];advance();}
          emit(TokenType.ERROR,'/'+errBody+' (unterminated)',startLine,startCol);
          continue;
        }
        pos++;column++;emit(TokenType.SLASH,'/',startLine,startCol);continue;
      }
      if(isDigit(ch)){
        var num='';
        while(pos<len&&isDigit(source[pos])){num+=source[pos];advance();}
        emit(TokenType.NUMBER,num,startLine,startCol);continue;
      }
      if(isIdentStart(ch)){
        var word='';
        while(pos<len&&isIdentContinue(source[pos])){word+=source[pos];advance();}
        emit(KEYWORDS.has(word)?word:TokenType.IDENTIFIER,word,startLine,startCol);continue;
      }
      var ch2=ch+(peek(1)||'');
      if(ch2==='->')  {advanceBy(2);emit(TokenType.ARROW,    '->',startLine,startCol);continue;}
      if(ch2==='..') {advanceBy(2);emit(TokenType.DOT_DOT,  '..',startLine,startCol);continue;}
      if(ch2==='==') {advanceBy(2);emit(TokenType.COMP_EQ,  '==',startLine,startCol);continue;}
      if(ch2==='!=') {advanceBy(2);emit(TokenType.COMP_NE,  '!=',startLine,startCol);continue;}
      if(ch2==='<=') {advanceBy(2);emit(TokenType.COMP_LE,  '<=',startLine,startCol);continue;}
      if(ch2==='>=') {advanceBy(2);emit(TokenType.COMP_GE,  '>=',startLine,startCol);continue;}
      if(ch2==='&&') {advanceBy(2);emit(TokenType.LOGIC_AND,'&&',startLine,startCol);continue;}
      if(ch2==='||') {advanceBy(2);emit(TokenType.LOGIC_OR, '||',startLine,startCol);continue;}
      switch(ch){
        case '=':advance();emit(TokenType.EQUALS,  '=',startLine,startCol);break;
        case ':':advance();emit(TokenType.COLON,   ':',startLine,startCol);break;
        case '|':advance();emit(TokenType.PIPE,    '|',startLine,startCol);break;
        case '?':advance();emit(TokenType.QUESTION,'?',startLine,startCol);break;
        case '.':advance();emit(TokenType.DOT,     '.',startLine,startCol);break;
        case '*':advance();emit(TokenType.STAR,    '*',startLine,startCol);break;
        case '<':advance();emit(TokenType.COMP_LT, '<',startLine,startCol);break;
        case '>':advance();emit(TokenType.COMP_GT, '>',startLine,startCol);break;
        case '{':advance();emit(TokenType.LBRACE,  '{',startLine,startCol);break;
        case '}':advance();emit(TokenType.RBRACE,  '}',startLine,startCol);break;
        case '[':advance();emit(TokenType.LBRACKET,'[',startLine,startCol);break;
        case ']':advance();emit(TokenType.RBRACKET,']',startLine,startCol);break;
        case '(':advance();emit(TokenType.LPAREN,  '(',startLine,startCol);break;
        case ')':advance();emit(TokenType.RPAREN,  ')',startLine,startCol);break;
        case ',':advance();emit(TokenType.COMMA,   ',',startLine,startCol);break;
        default: advance();emit(TokenType.ERROR,ch,startLine,startCol);break;
      }
    }
    emit(TokenType.EOF,'',line,column);
    return tokens;
  }

  var KNOWN_VERBS = new Set(['read','write','update','explore','emit','log']);

  function Parser(tokens) { this.tokens=tokens; this.pos=0; this.errors=[]; }

  Parser.prototype.peek = function() { return this.tokens[this.pos]; };
  Parser.prototype.advance = function() {
    var tok=this.tokens[this.pos];
    if(tok.type!==TokenType.EOF) this.pos++;
    return tok;
  };
  Parser.prototype.check = function(type) { return this.peek().type===type; };
  Parser.prototype.expect = function(type) {
    var tok=this.peek();
    if(tok.type===type) return this.advance();
    this.errors.push({message:"Expected '"+type+"' but got '"+tok.type+"' ('"+tok.value+"')",line:tok.line,column:tok.column});
    return {type,value:'',line:tok.line,column:tok.column};
  };
  Parser.prototype.match = function(type) { if(this.check(type)){this.advance();return true;}return false; };

  Parser.prototype.parseProgram = function() {
    var firstTok=this.peek(),body=[];
    while(!this.check(TokenType.EOF)){
      if(this.check(TokenType.LIFECYCLE)) body.push(this.parseLifecycle());
      else if(this.check(TokenType.ENTITY)) body.push(this.parseEntityDecl());
      else if(this.check(TokenType.RELATION)){var d=this.parseRelationDecl();if(d)body.push(d);}
      else if(this.check(TokenType.STRUCTURE)) body.push(this.parseStructure());
      else{var tok=this.peek();this.errors.push({message:"Unexpected token '"+tok.type+"' at top level",line:tok.line,column:tok.column});this.advance();}
    }
    var lastTok=this.tokens[this.pos];
    return Program(body,[],loc(firstTok,lastTok));
  };

  Parser.prototype.parseLifecycle = function() {
    var start=this.expect(TokenType.LIFECYCLE);
    var nameToken=this.expect(TokenType.IDENTIFIER);
    this.expect(TokenType.LBRACE);
    var props={role:null,model:null,trigger:null,input:[],execute:[],transitions:[],completion:[]};
    while(!this.check(TokenType.RBRACE)&&!this.check(TokenType.EOF)){
      if(this.check(TokenType.ROLE)) this.parseLifecycleField(props,'role');
      else if(this.check(TokenType.MODEL)) this.parseLifecycleField(props,'model');
      else if(this.check(TokenType.TRIGGER)) this.parseLifecycleTrigger(props);
      else if(this.check(TokenType.INPUT)) props.input=this.parseActionBlock();
      else if(this.check(TokenType.EXECUTE)) props.execute=this.parseActionBlock();
      else if(this.check(TokenType.COMPLETION)) props.completion=this.parseActionBlock();
      else if(this.check(TokenType.TRANSITIONS)) props.transitions=this.parseTransitionsBlock();
      else{var tok=this.peek();this.errors.push({message:"Unexpected '"+tok.value+"' in lifecycle",line:tok.line,column:tok.column});this.advance();}
    }
    var end=this.expect(TokenType.RBRACE);
    return LifecycleDecl(nameToken.value,props,loc(start,end));
  };
  Parser.prototype.parseLifecycleField = function(props,field) {
    this.advance();this.expect(TokenType.COLON);props[field]=this.expect(TokenType.IDENTIFIER).value;
  };
  Parser.prototype.parseLifecycleTrigger = function(props) {
    this.advance();this.expect(TokenType.COLON);props.trigger=this.parseExpression();
  };
  Parser.prototype.parseActionBlock = function() {
    this.advance();this.expect(TokenType.LBRACE);var steps=[];
    while(!this.check(TokenType.RBRACE)&&!this.check(TokenType.EOF)) steps.push(this.parseActionStep());
    this.expect(TokenType.RBRACE);return steps;
  };
  Parser.prototype.parseActionStep = function() {
    var start=this.peek(),verbTok=this.advance(),verb=verbTok.value,operands=[];
    while(!this.check(TokenType.RBRACE)&&!this.check(TokenType.EOF)){
      if(this.check(TokenType.IDENTIFIER)&&KNOWN_VERBS.has(this.peek().value)&&operands.length>0) break;
      if(this.isBlockKeyword()) break;
      operands.push(this.parseOperand());
    }
    var endPos=this.pos>0?this.pos-1:0;
    return ActionStep(verb,operands,loc(start,this.tokens[endPos]));
  };
  Parser.prototype.isTopLevelKeyword = function() {
    var t=this.peek().type;
    return t===TokenType.ENTITY||t===TokenType.RELATION||t===TokenType.LIFECYCLE||t===TokenType.STRUCTURE;
  };
  Parser.prototype.isBlockKeyword = function() {
    var t=this.peek().type;
    return t===TokenType.INPUT||t===TokenType.EXECUTE||t===TokenType.COMPLETION||
           t===TokenType.TRANSITIONS||t===TokenType.ROLE||t===TokenType.MODEL||t===TokenType.TRIGGER;
  };
  Parser.prototype.parseOperand = function() {
    var start=this.peek();
    if(this.check(TokenType.STRING)){var tok=this.advance();return Literal('string',tok.value,loc(tok,tok));}
    if(this.check(TokenType.DOT)) return this.parseDotPath();
    if(this.check(TokenType.IDENTIFIER)) return this.parseIdentOrFieldRefOrPath();
    if(this.check(TokenType.STAR)){var tok2=this.advance();return Literal('path','*',loc(tok2,tok2));}
    var tok3=this.advance();this.errors.push({message:"Unexpected '"+tok3.value+"' in operand",line:tok3.line,column:tok3.column});
    return Literal('error',tok3.value,loc(tok3,tok3));
  };
  Parser.prototype.parseDotPath = function() {
    var start=this.peek(),path='.';this.advance();
    if(this.check(TokenType.IDENTIFIER)) path+=this.advance().value;
    path=this.consumePathSegments(path,start);
    return Literal('path',path,loc(start,this.tokens[this.pos-1]));
  };
  Parser.prototype.parseIdentOrFieldRefOrPath = function() {
    var start=this.peek(),firstIdent=this.advance(),accum=firstIdent.value;
    if(this.check(TokenType.SLASH)){accum=this.consumePathSegments(accum,start);return Literal('path',accum,loc(start,this.tokens[this.pos-1]));}
    var segments=[firstIdent.value];
    while(this.check(TokenType.DOT)){
      this.advance();
      if(this.check(TokenType.IDENTIFIER)){segments.push(this.advance().value);}
      else{accum=segments.join('.')+'.';if(this.check(TokenType.IDENTIFIER))accum+=this.advance().value;
        if(this.check(TokenType.SLASH)){accum=this.consumePathSegments(accum,start);return Literal('path',accum,loc(start,this.tokens[this.pos-1]));}
        return Literal('path',accum,loc(start,this.tokens[this.pos-1]));}
      if(this.check(TokenType.SLASH)){accum=this.consumePathSegments(segments.join('.'),start);return Literal('path',accum,loc(start,this.tokens[this.pos-1]));}
    }
    if(segments.length>1){
      var assignment=null;
      if(this.check(TokenType.ARROW)){this.advance();if(this.check(TokenType.STRING))assignment=this.advance().value;}
      var ref=FieldRef(segments,loc(start,this.tokens[this.pos-1]));
      if(assignment!==null)ref.assignment=assignment;
      return ref;
    }
    return FieldRef([firstIdent.value],loc(start,firstIdent));
  };
  Parser.prototype.consumePathSegments = function(initial,startTok) {
    var path=initial;
    while(this.check(TokenType.SLASH)){
      this.advance();path+='/';
      if(this.check(TokenType.LBRACE)){
        this.advance();path+='{';
        if(this.check(TokenType.IDENTIFIER))path+=this.advance().value;
        while(this.check(TokenType.DOT)){this.advance();path+='.';if(this.check(TokenType.IDENTIFIER))path+=this.advance().value;}
        this.expect(TokenType.RBRACE);path+='}';
        if(this.check(TokenType.DOT)){this.advance();path+='.';if(this.check(TokenType.IDENTIFIER))path+=this.advance().value;}
      } else if(this.check(TokenType.STAR)){this.advance();path+='*';}
      else if(this.check(TokenType.IDENTIFIER)){
        path+=this.advance().value;
        if(this.check(TokenType.DOT)){this.advance();path+='.';if(this.check(TokenType.IDENTIFIER))path+=this.advance().value;}
      }
    }
    return path;
  };
  Parser.prototype.expectIdentifierOrKeyword = function() {

    }

})();
</script>

     MODULE 4: validator.js (lightweight inline)
     ============================================================ -->
<script>
(function() {
  'use strict';
  var KNOWN_PRIMITIVES = new Set(['string','number','boolean','date','markdown','yaml','json','path']);
  var WELL_KNOWN_STAGES = new Set(['planning','implementing','reviewing','fixing','completed','researching','wait']);

  function validate(ast) {
    if(!ast||!Array.isArray(ast.body)) return [];
    var errors=[], declaredEntities=new Set(), entityFieldMap=new Map();
    for(var i=0;i<ast.body.length;i++){
      var node=ast.body[i];
      if(node.type==='Entity'){
        declaredEntities.add(node.name);
        var fields=new Set();
        if(Array.isArray(node.fields))for(var j=0;j<node.fields.length;j++){if(node.fields[j]&&node.fields[j].name)fields.add(node.fields[j].name);}
        entityFieldMap.set(node.name,fields);
      }
    }
    for(var i=0;i<ast.body.length;i++){
      var node=ast.body[i];
      if(node.type==='Entity'&&Array.isArray(node.fields)){
        for(var j=0;j<node.fields.length;j++){
          var f=node.fields[j];if(!f)continue;
          if(f.fieldType&&f.fieldType.type==='TypeExpression'&&f.fieldType.kind==='reference'){
            var name=f.fieldType.name;
            if(!KNOWN_PRIMITIVES.has(name)&&!declaredEntities.has(name))
              errors.push({message:"Unknown field type '"+name+"'",severity:'error',rule:'unknown_field_type'});
          }
        }
      } else if(node.type==='Relation'){
        if(node.source&&!declaredEntities.has(node.source))errors.push({message:"Unknown relation source '"+node.source+"'",severity:'error',rule:'unknown_relation_source'});
        if(node.target&&!declaredEntities.has(node.target))errors.push({message:"Unknown relation target '"+node.target+"'",severity:'error',rule:'unknown_relation_target'});
      }
    }
    return errors;
  }

  window.PDSL.validator = { validate };
})();
</script>

  function adaptEntity(decl){

  function adaptRelations(relationDecls,entityNodeMap){

  }
  function adaptProgram(program){

})();

<script>
(function() {
  'use strict';
  var themes = window.PDSL.themes;

  function escapeXml(str){
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');
  }
  function waypointsToPoints(waypoints){return waypoints.map(function(p){return p.x+','+p.y;}).join(' ');}
  function midpoint(waypoints){
    if(!waypoints||waypoints.length===0)return{x:0,y:0};
    var mid=Math.floor(waypoints.length/2);
    if(waypoints.length===1)return waypoints[0];
    var a=waypoints[mid-1],b=waypoints[mid];
    return{x:(a.x+b.x)/2,y:(a.y+b.y)/2};
  }

  function renderStandardNode(node,style,theme){
    var x=node.x,y=node.y,w=node.width,h=node.height,label=node.label;
    var r=theme.spacing.cornerRadius,cx=x+w/2,cy=y+h/2;
    var rect='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+r+'" ry="'+r+'" fill="'+escapeXml(style.fill)+'" stroke="'+escapeXml(style.stroke)+'" stroke-width="1.5" />';
    var text='<text x="'+cx+'" y="'+cy+'" text-anchor="middle" dominant-baseline="central" font-family="'+escapeXml(theme.font.family)+'" font-size="'+theme.font.sizeTitle+'" fill="'+escapeXml(style.textColor)+'">'+escapeXml(label)+'</text>';
    return '<g class="node node-standard" data-id="'+escapeXml(node.id)+'">'+rect+text+'</g>';
  }

  function renderEntityNode(node,style,theme){
    var x=node.x,y=node.y,w=node.width,h=node.height,label=node.label;
    var hh=theme.spacing.headerHeight,frh=theme.spacing.fieldRowHeight,r=theme.spacing.cornerRadius,pad=theme.spacing.padding;
    var fields=(node.meta&&Array.isArray(node.meta.fields))?node.meta.fields:[];
    // Compute actual height for entity (may override layout height)
    var actualH=hh+pad+fields.length*frh+pad;
    if(actualH<h)actualH=h;

    var lines=[];
    // Outer rect
    lines.push('<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+actualH+'" rx="'+r+'" ry="'+r+'" fill="'+escapeXml(style.fill)+'" stroke="'+escapeXml(style.stroke)+'" stroke-width="1.5" />');
    // Header rect (with data-entity-header for dblclick interaction)
    lines.push('<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+hh+'" rx="'+r+'" ry="'+r+'" fill="'+escapeXml(style.headerFill)+'" stroke="'+escapeXml(style.stroke)+'" stroke-width="1.5" data-entity-header="'+escapeXml(label)+'" style="cursor:pointer" />');
    // Square off bottom of header
    lines.push('<rect x="'+x+'" y="'+(y+hh/2)+'" width="'+w+'" height="'+(hh/2)+'" fill="'+escapeXml(style.headerFill)+'" stroke="none" />');
    // Header text (also with data-entity-header)
    var headerTextColor=style.headerText||'#FFFFFF';
    lines.push('<text x="'+(x+w/2)+'" y="'+(y+hh/2)+'" text-anchor="middle" dominant-baseline="central" font-family="'+escapeXml(theme.font.family)+'" font-size="'+theme.font.sizeTitle+'" font-weight="bold" fill="'+escapeXml(headerTextColor)+'" data-entity-header="'+escapeXml(label)+'" style="cursor:pointer;pointer-events:none">'+escapeXml(label)+'</text>');
    // Divider
    lines.push('<line x1="'+x+'" y1="'+(y+hh)+'" x2="'+(x+w)+'" y2="'+(y+hh)+'" stroke="'+escapeXml(style.stroke)+'" stroke-width="1" />');
    // Field rows
    for(var i=0;i<fields.length;i++){
      var fieldY=y+hh+pad+(i+0.5)*frh;
      var fieldText=fields[i].name+': '+fields[i].type+(fields[i].optional?' ?':'');
      lines.push('<text x="'+(x+pad)+'" y="'+fieldY+'" text-anchor="start" dominant-baseline="central" font-family="'+escapeXml(theme.font.family)+'" font-size="'+theme.font.sizeBody+'" fill="'+escapeXml(style.textColor)+'">'+escapeXml(fieldText)+'</text>');
    }

    // Wrap in group with data-entity for right-click
    return '<g class="node node-entity" data-id="'+escapeXml(node.id)+'" data-entity="'+escapeXml(label)+'">'+lines.join('')+'</g>';
  }

  function renderNode(node,theme){
    var style=themes.getNodeStyle(theme,node);
    var kind=(node.meta&&(node.meta.kind||node.meta.nodeType))||'generic';
    if(kind==='entity'&&node.meta&&Array.isArray(node.meta.fields)) return renderEntityNode(node,style,theme);
    return renderStandardNode(node,style,theme);
  }

  function buildSelfLoopPath(waypoints){
    if(waypoints.length<4){var p=waypoints[0]||{x:0,y:0};return 'M '+p.x+','+p.y+' C '+(p.x-30)+','+(p.y-60)+' '+(p.x+30)+','+(p.y-60)+' '+p.x+','+p.y;}
    var p0=waypoints[0],p1=waypoints[1],p2=waypoints[2],p3=waypoints[3];
    return 'M '+p0.x+','+p0.y+' L '+p1.x+','+p1.y+' L '+p2.x+','+p2.y+' L '+p3.x+','+p3.y;
  }

  function renderEdge(edge,theme){
    var waypoints=edge.waypoints||[],label=edge.label,meta=edge.meta||{};
    var stroke=theme.edge.stroke,strokeWidth=theme.edge.strokeWidth,labelColor=theme.edge.labelColor;
    var isSelfRef=meta.isSelfRef||edge.source===edge.target,lines=[];
    if(isSelfRef){lines.push('<path d="'+escapeXml(buildSelfLoopPath(waypoints))+'" fill="none" stroke="'+escapeXml(stroke)+'" stroke-width="'+strokeWidth+'" marker-end="url(#arrowhead)" />');}
    else if(waypoints.length>=2){lines.push('<polyline points="'+escapeXml(waypointsToPoints(waypoints))+'" fill="none" stroke="'+escapeXml(stroke)+'" stroke-width="'+strokeWidth+'" marker-end="url(#arrowhead)" />');}
    if(label&&label.trim()){var mp=midpoint(waypoints);lines.push('<text x="'+mp.x+'" y="'+(mp.y-6)+'" text-anchor="middle" font-family="'+escapeXml(theme.font.family)+'" font-size="'+theme.font.sizeLabel+'" fill="'+escapeXml(labelColor)+'">'+escapeXml(label)+'</text>');}
    return '<g class="edge" data-source="'+escapeXml(edge.source)+'" data-target="'+escapeXml(edge.target)+'">'+lines.join('')+'</g>';
  }

  function renderDefs(theme){
    var stroke=theme.edge.stroke,arrowSize=theme.edge.arrowSize,half=arrowSize/2;
    return '<defs><marker id="arrowhead" markerWidth="'+arrowSize+'" markerHeight="'+arrowSize+'" refX="'+(arrowSize-1)+'" refY="'+half+'" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,'+arrowSize+' L'+arrowSize+','+half+' z" fill="'+escapeXml(stroke)+'" /></marker></defs>';
  }

  function render(layoutGraph,theme){
    if(!theme)theme=themes.defaultTheme();
    var nodes=layoutGraph.nodes||[],edges=layoutGraph.edges||[];
    var MARGIN=20,width=(layoutGraph.width||0)+MARGIN*2,height=(layoutGraph.height||0)+MARGIN*2;
    var svgWidth=Math.max(width,200),svgHeight=Math.max(height,120);
    var lines=[];
    lines.push('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+svgWidth+' '+svgHeight+'" width="'+svgWidth+'" height="'+svgHeight+'">');
    lines.push(renderDefs(theme));
    lines.push('<g class="edges">');
    for(var i=0;i<edges.length;i++)lines.push(renderEdge(edges[i],theme));
    lines.push('</g>');
    lines.push('<g class="nodes">');
    for(var i=0;i<nodes.length;i++)lines.push(renderNode(nodes[i],theme));
    lines.push('</g>');
    lines.push('</svg>');
    return lines.join('\n');
  }

  window.PDSL.renderer = { render };
})();
</script>

<script>
(function() {
  'use strict';
  var _ast = window.PDSL.ast;
  var EntityDecl = _ast.EntityDecl;
  var FieldDecl = _ast.FieldDecl;
  var TypeExpression = _ast.TypeExpression;
  var Program = _ast.Program;

  var EditCommand = Object.freeze({
    ADD_FIELD:     'addField',
    REMOVE_FIELD:  'removeField',
    RENAME_ENTITY: 'renameEntity',
  });

  function addFieldCommand(entityName,fieldName,fieldType){return{type:EditCommand.ADD_FIELD,entityName,fieldName,fieldType};}
  function removeFieldCommand(entityName,fieldName){return{type:EditCommand.REMOVE_FIELD,entityName,fieldName};}
  function renameEntityCommand(oldName,newName){return{type:EditCommand.RENAME_ENTITY,oldName,newName};}

  function applyEdit(ast,command){
    if(!ast||!Array.isArray(ast.body)) throw new Error('applyEdit: ast must be a Program node with a body array');
    if(!command||!command.type) throw new Error('applyEdit: command must have a type property');
    switch(command.type){
      case EditCommand.ADD_FIELD:     return applyAddField(ast,command);
      case EditCommand.REMOVE_FIELD:  return applyRemoveField(ast,command);
      case EditCommand.RENAME_ENTITY: return applyRenameEntity(ast,command);
      default: throw new Error("applyEdit: unknown command type '"+command.type+"'");
    }
  }

  function applyAddField(ast,command){
    var entityName=command.entityName,fieldName=command.fieldName,fieldType=command.fieldType;
    var entityIndex=ast.body.findIndex(function(n){return n&&n.type==='Entity'&&n.name===entityName;});
    if(entityIndex===-1) throw new Error("applyEdit addField: entity '"+entityName+"' not found");
    var entity=ast.body[entityIndex];
    var newField=FieldDecl(fieldName,{fieldType:TypeExpression('reference',fieldType,null,null),optional:false,defaultValue:null,pattern:null,cardinality:null},null);
    var updatedEntity=EntityDecl(entity.name,(Array.isArray(entity.fields)?entity.fields:[]).concat([newField]),entity.loc);
    var newBody=ast.body.slice();newBody[entityIndex]=updatedEntity;
    return Program(newBody,ast.comments||[],ast.loc);
  }

  function applyRemoveField(ast,command){
    var entityName=command.entityName,fieldName=command.fieldName;
    var entityIndex=ast.body.findIndex(function(n){return n&&n.type==='Entity'&&n.name===entityName;});
    if(entityIndex===-1) throw new Error("applyEdit removeField: entity '"+entityName+"' not found");
    var entity=ast.body[entityIndex];
    var updatedFields=(Array.isArray(entity.fields)?entity.fields:[]).filter(function(f){return f&&f.name!==fieldName;});
    var updatedEntity=EntityDecl(entity.name,updatedFields,entity.loc);
    var newBody=ast.body.slice();newBody[entityIndex]=updatedEntity;
    return Program(newBody,ast.comments||[],ast.loc);
  }

  function applyRenameEntity(ast,command){
    var oldName=command.oldName,newName=command.newName;
    var entityIndex=ast.body.findIndex(function(n){return n&&n.type==='Entity'&&n.name===oldName;});
    if(entityIndex===-1) throw new Error("applyEdit renameEntity: entity '"+oldName+"' not found");
    var entity=ast.body[entityIndex];
    var updatedEntity=EntityDecl(newName,entity.fields||[],entity.loc);
    var newBody=ast.body.slice();newBody[entityIndex]=updatedEntity;
    for(var i=0;i<newBody.length;i++){
      var node=newBody[i];if(!node||node.type!=='Relation')continue;
      var updatedSource=node.source===oldName?newName:node.source;
      var updatedTarget=node.target===oldName?newName:node.target;
      if(updatedSource!==node.source||updatedTarget!==node.target)newBody[i]=Object.assign({},node,{source:updatedSource,target:updatedTarget});
    }
    return Program(newBody,ast.comments||[],ast.loc);
  }

  window.PDSL.editor = { EditCommand, addFieldCommand, removeFieldCommand, renameEntityCommand, applyEdit };
})();
</script>

<!-- ============================================================
     UI APPLICATION LOGIC
     ============================================================ -->
<script>
(function() {
  'use strict';

  var sourceTextarea = document.getElementById('source');
  var errorPanel     = document.getElementById('error-panel');
  var svgContainer   = document.getElementById('svg-container');
  var contextMenu    = document.getElementById('context-menu');
  var divider        = document.getElementById('divider');
  var leftPane       = document.getElementById('left-pane');

  // Default PDSL example shown on load
  var DEFAULT_EXAMPLE = [
    'entity Task {',
    '  id: string',
    '  title: string',
    '  status: string',
    '  assignee: string ?',
    '}',
    '',
    'entity Adventure {',
    '  id: string',
    '  title: string',
    '  stage: string',
    '}',
    '',
    'relation Task -> Adventure {',
    '  type: belongs_to',
    '  cardinality: 1..*',
    '}',
    '',
    'lifecycle PlanningCycle {',
    '  role: planner',
    '  model: opus',
    '',
    '  transitions {',
    '    on complete -> implementing',
    '    on revise -> planning',
    '  }',
    '}',
  ].join('\n');

  // ---- Debounced re-render ----
  var debounceTimer = null;
  function scheduleRender() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(renderDiagram, 300);
  }

  sourceTextarea.addEventListener('input', scheduleRender);

  // ---- Main render function ----
  function renderDiagram() {
    var source = sourceTextarea.value;
    var result = window.PDSL.parser.parse(source);
    var ast = result.ast;
    var errors = result.errors;

    if (errors.length > 0) {
      errorPanel.textContent = errors.map(function(e) {
        return 'Line ' + e.line + ':' + e.column + ' ' + e.message;
      }).join('\n');
      // Keep previous diagram visible on error
      return;
    }
    errorPanel.textContent = '';

    try {
      // Use slightly larger node height for entity nodes (layout uses 40 by default)
      var graph = window.PDSL.layout.layout(ast, { nodeHeight: 40 });
      var theme = window.PDSL.themes.defaultTheme();
      var svgString = window.PDSL.renderer.render(graph, theme);
      svgContainer.innerHTML = svgString;
      attachEntityEvents();
    } catch (err) {
      errorPanel.textContent = 'Render error: ' + err.message;
    }
  }

  // ---- Entity interaction ----
  function attachEntityEvents() {
    // Double-click on header rects/text to rename
    var headers = svgContainer.querySelectorAll('[data-entity-header]');
    headers.forEach(function(el) {
      el.addEventListener('dblclick', handleRename);
    });

    // Right-click on entity group for context menu
    var entityGroups = svgContainer.querySelectorAll('[data-entity]');
    entityGroups.forEach(function(el) {
      el.addEventListener('contextmenu', handleContextMenu);
    });
  }

  function getEntityName(target) {
    // Walk up to find [data-entity]
    var el = target;
    while (el && el !== svgContainer) {
      if (el.dataset && el.dataset.entity) return el.dataset.entity;
      if (el.getAttribute && el.getAttribute('data-entity-header')) return el.getAttribute('data-entity-header');
      el = el.parentElement;
    }
    return null;
  }

  function handleRename(event) {
    var entityName = event.currentTarget.getAttribute('data-entity-header') ||
                     getEntityName(event.currentTarget);
    if (!entityName) return;

    var newName = window.prompt('Rename entity "' + entityName + '" to:', entityName);
    if (!newName || newName.trim() === '' || newName.trim() === entityName) return;
    newName = newName.trim();

    try {
      var result = window.PDSL.parser.parse(sourceTextarea.value);
      if (result.errors.length > 0) { alert('Fix parse errors before renaming.'); return; }
      var newAst = window.PDSL.editor.applyEdit(result.ast, window.PDSL.editor.renameEntityCommand(entityName, newName));
      sourceTextarea.value = window.PDSL.serializer.serialize(newAst);
      renderDiagram();
    } catch(err) {
      alert('Rename failed: ' + err.message);
    }
  }

  function handleContextMenu(event) {
    event.preventDefault();
    var entityName = event.currentTarget.getAttribute('data-entity') ||
                     getEntityName(event.currentTarget);
    if (!entityName) return;

    showContextMenu(event.clientX, event.clientY, [
      {
        label: 'Add field\u2026',
        action: function() { handleAddField(entityName); }
      },
      {
        label: 'Rename\u2026',
        action: function() {
          var newName = window.prompt('Rename entity "' + entityName + '" to:', entityName);
          if (!newName || newName.trim() === '' || newName.trim() === entityName) return;
          newName = newName.trim();
          try {
            var result = window.PDSL.parser.parse(sourceTextarea.value);
            var newAst = window.PDSL.editor.applyEdit(result.ast, window.PDSL.editor.renameEntityCommand(entityName, newName));
            sourceTextarea.value = window.PDSL.serializer.serialize(newAst);
            renderDiagram();
          } catch(err) { alert('Rename failed: ' + err.message); }
        }
      },
    ]);
  }

  function handleAddField(entityName) {
    var fieldSpec = window.prompt(
      'Add field to "' + entityName + '":\nFormat: fieldName: fieldType\nExample: createdAt: string',
      'newField: string'
    );
    if (!fieldSpec) return;
    var parts = fieldSpec.split(':');
    if (parts.length < 2) { alert('Invalid format. Use: fieldName: fieldType'); return; }
    var fieldName = parts[0].trim();
    var fieldType = parts.slice(1).join(':').trim();
    if (!fieldName || !fieldType) { alert('Both field name and type are required.'); return; }

    try {
      var result = window.PDSL.parser.parse(sourceTextarea.value);
      if (result.errors.length > 0) { alert('Fix parse errors before adding fields.'); return; }
      var newAst = window.PDSL.editor.applyEdit(result.ast, window.PDSL.editor.addFieldCommand(entityName, fieldName, fieldType));
      sourceTextarea.value = window.PDSL.serializer.serialize(newAst);
      renderDiagram();
    } catch(err) {
      alert('Add field failed: ' + err.message);
    }
  }

  // ---- Context menu ----
  function showContextMenu(x, y, items) {
    contextMenu.innerHTML = '';
    items.forEach(function(item) {
      var div = document.createElement('div');
      div.className = 'context-menu-item';
      div.textContent = item.label;
      div.addEventListener('click', function() {
        hideContextMenu();
        item.action();
      });
      contextMenu.appendChild(div);
    });
    contextMenu.style.left = x + 'px';
    contextMenu.style.top  = y + 'px';
    contextMenu.style.display = 'block';
  }

  function hideContextMenu() {
    contextMenu.style.display = 'none';
  }

  document.addEventListener('click', hideContextMenu);
  document.addEventListener('keydown', function(e) { if(e.key==='Escape') hideContextMenu(); });

  // ---- Draggable divider ----
  var isDragging = false;
  divider.addEventListener('mousedown', function(e) {
    isDragging = true;
    divider.classList.add('dragging');
    e.preventDefault();
  });
  document.addEventListener('mousemove', function(e) {
    if (!isDragging) return;
    var appRect = document.getElementById('app').getBoundingClientRect();
    var x = e.clientX - appRect.left;
    var pct = (x / appRect.width) * 100;
    pct = Math.max(20, Math.min(80, pct));
    leftPane.style.width = pct + '%';
  });
  document.addEventListener('mouseup', function() {
    if (isDragging) { isDragging = false; divider.classList.remove('dragging'); }
  });

  // ---- Initialize ----
  sourceTextarea.value = DEFAULT_EXAMPLE;
  renderDiagram();

})();
</script>
